; Place at mods/JE3/modcompatibility.ini, alongside JE3's DATAxbox folder.
; Explicit mappings for the September 27 JE3 build.
[Mods]
extended_graphics_memory=1
expanded_world_properties=1
faction_support=1
impact_stun_ammo=1
extra_grenade_slot=1

; Optional features: enable only the ones wanted by this mod.
custom_voice_packs=0
exops_followers=0
permanent_contract_failure=0
throwable_c4=0
permadeath=0

[SupportFactions]
; Ammo template: pickup/activation eligibility and in-world price.
template_sam_deliveralliesbradley50FULL=allies
template_sam_deliverAlliesBlackhawkFULL=allies
template_sam_deliverdfhumveeatFULL=allies
template_sam_dfhumveefull=allies
template_sam_deliveralliesstrykerFULL=allies
template_sam_allieshumveefull=allies
template_sam_deliverallieshumveeatFULL=allies
template_sam_crate_COALITION=allies
template_sam_deliveralliesjeepFULL=allies
template_sam_deliverallieskafvFULL=allies
template_sam_crate_DF=allies

; PDA Template_object_name: eligibility and displayed catalog price.
; These entries do not add the items to the PDA catalog.
template_sup_deliveralliesbradley50FULL=allies
template_sup_deliverAlliesBlackhawkFULL=allies
template_sup_deliverdfhumveeatFULL=allies
template_sup_deliverdfhumveeFULL=allies
template_sup_deliveralliesstrykerFULL=allies
template_sup_allieshumveefull=allies
template_sup_deliverallieshumveeatFULL=allies
template_sup_crate_COALITION=allies
template_sup_deliveralliesjeepFULL=allies
template_sup_deliverallieskafvFULL=allies
template_sup_crate_df=allies

[ImpactStunAmmo]
template_amm_STUNGRENADELAUNCHER=1

[Permadeath]
; Stable identity supplied by the INI. It is NOT derived from the folder name.
; Records the latest completed save even while permadeath=0.
save_profile=je3

[PermanentContractFailure]
; Exact mission asset IDs, one at a time. Examples only: uncomment after testing.
; sw_allies3=1
; ne_china2=1
; Ace and playable intro missions are always exempt.

[ThrowableC4]
template_amm_THROWABLEC4=1

[VoicePacks]
; Map an NPC template to an authored human_set sound-effect configuration.
; template_my_exops_soldier=my_exops_human_sound
